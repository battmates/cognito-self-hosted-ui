x-app: &app
  build:
    context: .
    target: development
  image: cognito-self-hosted-ui:local
  env_file:
    - .env
  volumes:
    - .:/var/www/html
    - app-storage:/var/www/html/storage
    - dev-vendor:/var/www/html/vendor
    - dev-bootstrap-cache:/var/www/html/bootstrap/cache
    - ./docker/php-development.ini:/usr/local/etc/php/conf.d/zz-development.ini:ro
  restart: unless-stopped

services:
  database:
    image: mysql:8.4
    profiles: ["local-db"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  app:
    <<: *app
    ports:
      - "${DOCKER_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  queue:
    <<: *app
    command: ["php", "artisan", "queue:listen", "--sleep=3", "--tries=3", "--timeout=60"]
    stop_grace_period: 70s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-storage:
  mysql-data:
  dev-vendor:
  dev-bootstrap-cache:
